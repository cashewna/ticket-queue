name: ticket-queue

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket_dev_password
      POSTGRES_DB: ticket_queue
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticket_queue"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgres://ticket:ticket_dev_password@db:5432/ticket_queue
      PORT: "3000"
      HOST: 0.0.0.0
      NODE_ENV: production
      LOG_LEVEL: info
      # Seeded demo credentials. Non-production by design; see README.
      SEED_DEMO: "true"
      DEMO_PASSWORD: demo-pass-123
      SESSION_TTL_HOURS: "168"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

volumes:
  pgdata:
