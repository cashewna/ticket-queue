name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ticket
          POSTGRES_PASSWORD: ticket_dev_password
          POSTGRES_DB: ticket_queue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticket -d ticket_queue_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://ticket:ticket_dev_password@localhost:5432/ticket_queue_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  compose:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Start the stack
        run: docker compose up -d --build

      - name: Exercise create, assign, comment, resolve, close over HTTP
        env:
          BASE_URL: http://localhost:3000
          DEMO_PASSWORD: demo-pass-123
        run: node scripts/acceptance.mjs

      - name: Show container state and logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v --remove-orphans
